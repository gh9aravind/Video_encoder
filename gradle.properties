# Project-wide Gradle settings

# Enable AndroidX — required for all Jetpack/Compose libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# JVM heap size for Gradle daemon (helps with large builds like FFmpegKit)
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Enable parallel project execution
org.gradle.parallel=true

# AndroidX/Jetifier — false since all our deps are already AndroidX-native
android.enableJetifier=false
